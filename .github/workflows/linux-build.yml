name: Linux build

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Pin the obs-studio tag: the plugin compiles against a specific libobs API.
  OBS_TAG: "33.0.1"
  SIMDE_TAG: "v0.8.2"

jobs:
  # ---------------------------------------------------------------------------
  # Fast feedback: parse/compile every plugin source against the real libobs
  # headers.  This catches libobs API breaks in a few seconds without building
  # or linking anything.
  # ---------------------------------------------------------------------------
  compile-check:
    name: Compile check (libobs headers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache obs-studio headers
        id: obs-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/obs-studio
          key: obs-headers-${{ env.OBS_TAG }}

      - name: Cache simde headers
        id: simde-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/simde
          key: simde-${{ env.SIMDE_TAG }}

      - name: Fetch libobs headers
        if: steps.obs-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$OBS_TAG" --filter=blob:none --sparse \
            https://github.com/obsproject/obs-studio.git "$RUNNER_TEMP/obs-studio"
          git -C "$RUNNER_TEMP/obs-studio" sparse-checkout set libobs

      - name: Fetch simde headers
        if: steps.simde-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$SIMDE_TAG" --filter=blob:none \
            https://github.com/simd-everywhere/simde.git "$RUNNER_TEMP/simde"

      # libobs/obs-config.h includes "obsconfig.h", which is generated by the
      # obs-studio CMake build.  A minimal one is enough for a syntax check.
      - name: Generate obsconfig.h
        run: |
          mkdir -p "$RUNNER_TEMP/obs-stub/include"
          cat > "$RUNNER_TEMP/obs-stub/include/obsconfig.h" <<'EOF'
          #pragma once
          #define OBS_INSTALL_PREFIX "/usr"
          #define OBS_DATA_PATH "share/obs"
          #define OBS_PLUGIN_PATH "lib/obs-plugins"
          #define OBS_PLUGIN_DESTINATION "lib/obs-plugins"
          #define OBS_RELEASE_CANDIDATE 0
          #define OBS_BETA 0
          EOF

      - name: Syntax-check plugin sources
        run: |
          set -euo pipefail
          SRCS=(
            vtuber_plugin.cpp
            VtuberPlugin.cpp
            VtuberFrameWork.cpp
            VtuberDelegate.cpp
            View.cpp
            Live2DManager.cpp
            Model.cpp
            Pal.cpp
            LAppTextureManager.cpp
            LAppAllocator.cpp
            Sprite.cpp
            HookWin32.cpp
            HookLinux.cpp
            EventManager.cpp
            Define.cpp
            jsoncpp.cpp
            InfoReader.cpp
            EglContext.cpp
          )
          INCLUDES=(
            -I"$RUNNER_TEMP/obs-studio/libobs"
            -I"$RUNNER_TEMP/obs-stub/include"
            -I"$RUNNER_TEMP/simde"
            -IthirdParty/glew/include
            -ICubismSdk/Core/include
            -ICubismSdk/Framework/src
            -ICubismSdk/Framework/src/Rendering/OpenGL
            -IthirdParty/stb
          )
          fail=0
          for src in "${SRCS[@]}"; do
            echo "::group::g++ -fsyntax-only $src"
            if ! g++ -std=c++17 -fsyntax-only "${INCLUDES[@]}" \
                -DGLEW_NO_GLU -DCSM_TARGET_LINUX_GL "$src"; then
              fail=1
            fi
            echo "::endgroup::"
          done
          exit "$fail"

  # ---------------------------------------------------------------------------
  # Full build + package.
  #
  # Why an import stub instead of building libobs itself:
  # obs-studio 33.0.1's libobs requires FFmpeg >= 8.0 plus uthash/jansson and
  # its own obs-deps bundle.  Stock ubuntu-latest does not provide those, so a
  # faithful "cmake --build --target libobs" is not reproducible here (OBS's
  # own CI downloads prebuilt obs-deps for this reason).  We therefore compile
  # AND link the plugin against the real libobs headers plus a tiny import stub
  # that exports the symbols the plugin uses.  This validates the full compile
  # + link path and produces a loadable module with DT_NEEDED libobs.so.30.
  #
  # The command that would be used with a real libobs build, for reference:
  #   cmake -S obs-studio -B obs-build -DCMAKE_BUILD_TYPE=Release \
  #         -DENABLE_FRONTEND=OFF -DENABLE_SCRIPTING=OFF
  #   cmake --build obs-build --target libobs -j"$(nproc)"
  # ---------------------------------------------------------------------------
  build:
    name: Build and package
    runs-on: ubuntu-latest
    needs: compile-check
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++ cmake libegl-dev libgl-dev libx11-dev

      - name: Cache obs-studio headers
        id: obs-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/obs-studio
          key: obs-headers-${{ env.OBS_TAG }}

      - name: Cache simde headers
        id: simde-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/simde
          key: simde-${{ env.SIMDE_TAG }}

      - name: Fetch libobs headers
        if: steps.obs-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$OBS_TAG" --filter=blob:none --sparse \
            https://github.com/obsproject/obs-studio.git "$RUNNER_TEMP/obs-studio"
          git -C "$RUNNER_TEMP/obs-studio" sparse-checkout set libobs

      - name: Fetch simde headers
        if: steps.simde-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$SIMDE_TAG" --filter=blob:none \
            https://github.com/simd-everywhere/simde.git "$RUNNER_TEMP/simde"

      - name: Build and package
        run: |
          # The script fetches the libobs headers, builds the import stub and
          # compiles/packages the plugin in one go (same code path a user
          # without libobs-dev would use).
          packaging/build-with-obs-headers.sh \
            --build-dir "$RUNNER_TEMP/build" \
            --prefix "$RUNNER_TEMP/prefix"
          EXTRA_CMAKE_ARGS="-DCMAKE_PREFIX_PATH=$HOME/.cache/bongobs-cat/obs-stub -DCMAKE_MODULE_LINKER_FLAGS=-Wl,--no-as-needed" \
            packaging/make-release.sh

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: bongobs-cat-linux
          path: dist/*.tar.gz
          if-no-files-found: error
